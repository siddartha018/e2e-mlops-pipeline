name: ci

on:
  push:
    branches: [main]
    paths:
      - "prior-projects/06-mlops-pipeline/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "prior-projects/06-mlops-pipeline/**"
      - ".github/workflows/**"

defaults:
  run:
    working-directory: prior-projects/06-mlops-pipeline

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy (best-effort)
        continue-on-error: true
        run: uv run mypy src

      - name: Pytest (fast tests only)
        run: uv run pytest -m "not slow" -q
